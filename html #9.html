<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tabla financiera</title>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>Concepto</th>
        <th>Ingresos</th>
        <th>Gastos</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Enero</td>
        <td>$5,000</td>
        <td>$2,000</td>
      </tr>
      <tr>
        <td>Febrero</td>
        <td>$6,500</td>
        <td>$2,300</td>
      </tr>
      <tr>
        <td>Marzo</td>
        <td>$7,200</td>
        <td>$2,800</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td>Total</td>
        <td>$18,700</td>
        <td>$7,100</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
