<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>citas y énfasis</title>
</head>
<body>
    <h1>la importancia de HTML</h1>

    <blockquote cite="https://developer.mozilla.org/es/docs/Web/HTML">
        <p>
            HTML es el lenguaje utilizado para estructurar el contenido de
            una página web. Es <em>fundamental para crear documentos web</em>.
        </p>
    </blockquote>
</body>
</html>
